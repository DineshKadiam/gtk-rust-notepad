name: Build (weekly)

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: codeberg-medium
    container:
      image: docker.io/archlinux:latest
    steps:
      # Install deps, Clang for linking
      - name: Install dependencies
        run: pacman -Sy --noconfirm rustup git clang pkgconf gtk4 vte4 libadwaita libpanel gtksourceview5 blueprint-compiler musl nodejs
      - name: Set up rustup
        run: |
          rustup toolchain install stable
          rustup target add x86_64-unknown-linux-musl
      # clone
      - run: git clone https://codeberg.org/pastthepixels/kyanite .
      # Build
      - name: Build for Linux glibc x64
        run: cargo build --target=x86_64-unknown-linux-gnu --release
      # NOTE: fuck you fuck you fuck you fuck you fuck you !!!!!!!
      - name: Build for Linux musl x64
        run: RUSTFLAGS="-Clink-arg=-fuse-ld=lld -Ctarget-feature=-crt-static -lm" PKG_CONFIG_SYSROOT_DIR=/  cargo build --target=x86_64-unknown-linux-musl --release
      # Upload
      - uses: actions/upload-artifact@v3
        with:
          name: kyanite_x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/ky
      - uses: actions/upload-artifact@v3
        with:
          name: kyanite_x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/ky
