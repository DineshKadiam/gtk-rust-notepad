name: Build (nightly)

on: [push]
jobs:
  build:
    runs-on: codeberg-medium
    container:
      image: docker.io/rust:alpine3.24
    steps:
      # Install deps, Clang for linking
      - name: Install dependencies
        run: apk update && apk add gtk4.0-dev vte3-dev vte3-gtk4 libadwaita-dev libpanel-dev gtksourceview5-dev git clang 
      # clone
      - run: git clone https://codeberg.org/pastthepixels/kyanite .
      # Build
      # - name: Build for Linux glibc x64
      #   run: |
      #     rustup target add x86_64-unknown-linux-gnu
      #     cargo build --target=x86_64-unknown-linux-gnu --release
      - name: Build for Linux x64
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --target=x86_64-unknown-linux-musl --release
      # Upload 
      - name: (sigh) Install node
        run: apk install nodejs
      # - uses: actions/upload-artifact@v3
      #   with:
      #     name: kyanite_x86_64-unknown-linux-gnu
      #     path: target/x86_64-unknown-linux-gnu/release/kyanite
      - uses: actions/upload-artifact@v3
        with:
          name: kyanite_x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/kyanite
