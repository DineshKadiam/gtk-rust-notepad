[package]
name = "kyanite"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ky"
path = "src/main.rs"

[dependencies]
adw = { version = "^0.9", package = "libadwaita", features = ["v1_8"] }
gtk = { version = "^0.11", package = "gtk4", features = ["v4_20", "blueprint"] }
libpanel = "0.7.0"
serde = { version = "^1.0", features = ["derive"] }
sourceview5 = { version = "^0.11", features = ["v5_18"] }
toml = "1.1.2"
vte4 = { version = "0.10.0", features = ["v0_78"] }
# ↓ These are all for LSP support
async-channel = "2.5.0"
async-lsp = "0.2.3"
futures = "0.3.32"
tokio = { version = "1.52.1", features = ["full"] }
tower = "0.5.3"
async-process = "2.5.0"
markdown = "1.0.0"
serde_json = "1.0.151"
itertools = "0.15.0"
lazy_static = "1.5.0"
