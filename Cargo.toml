[package]
name = "spikedit"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "^0.9", package = "libadwaita", features = ["v1_8"] }
gtk = { version = "^0.11", package = "gtk4", features = ["v4_20", "blueprint"] }
libpanel = "0.7.0"
serde = { version = "^1.0", features = ["derive"] }
sourceview5 = { version = "^0.11", features = ["v5_4"] }
toml = "1.1.2"
vte4 = { version = "0.10.0", features = ["v0_78"] }
